services:
  postgres:
    image: postgres:16-alpine
    container_name: figma2react-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: figma2react
      POSTGRES_PASSWORD: figma2react_secret
      POSTGRES_DB: figma2react_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figma2react -d figma2react_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
